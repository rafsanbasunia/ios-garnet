# devices/garnet/device.conf: what this device is, and how far each part works as seen on the phone.
# tools/hakios-device.py reads it; the format is docs/porting/repositories.md of HakiOS.
#
# Credits: the POCO X6 5G port of HakiOS -- device repository, UEFI platform, touch, buttons, the first Adreno 710
# bring-up -- is the work of Montfort (github.com/JosephMontfort) and Jotan (github.com/sudo-joaopuser), in
# hakios-sm7435 and hakios-xnu-kernel-garnet. HakiOS itself is by the HakiOS developers (github.com/oosexgang).

device garnet
	title       POCO X6 5G
	vendor      Xiaomi
	soc         sm7435
	defconfig   garnet_defconfig
	firmware    pull-firmware.sh
	maintainer  Rafsan (github.com/rafsanbasunia)
	status      display     works     the panel through UEFI's framebuffer
	status      touch       works     FocalTech FT3683G on QUP1 SE3 SPI, multitouch PV2 (CONFIG_HAKIOS_FOCALTECH, garnet_touch=1)
	status      buttons     works     power and volume through the PM6450 PMIC (CONFIG_HAKIOS_BUTTONS, garnet_buttons=1)
	status      cpu         works     all 8 cores, the big one at 2.4 GHz (cpus=8 bootcpu=7 garnet_cpufreq=1)
	status      gpu         works     Adreno 710 at 345-940 MHz; the window server draws through Metal with GMEM tiles (gpu=1 metal=1 metal_gmem=1); coloured blocks at a tile seam during fast swipes
	status      storage     works     UFS read through the loader; /private/var with var_store=1 ufs_write=1
	status      audio       partial   dual AW88261 speaker amplifiers; the audio DSP not done
	status      battery     partial   the level is read; charging under this kernel is not done
	status      haptic      partial   vibration motor adapted; effects not done
	status      camera      missing   not ported
	status      torch       missing   not ported
	status      wifi        works     WCN3990-class radio on the WPSS DSP, Linux ath10k (wifi=1); scans and joins 2.4 and 5 GHz WPA2 networks from Settings; no WPA3
	status      bluetooth   partial   the WCN3991 on its UART (bt=3); Darwin's Bluetooth daemon runs on it: Settings' switch, scanning, Bluetooth LE through CoreBluetooth, earbuds paired and connected from Settings; no sound through them yet (115200 baud, no audio route)
	status      cellular    missing   not ported
	status      thermal     partial   the SoC's sensors are read
